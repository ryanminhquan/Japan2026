<title>Tabi Japan Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#EEF0F3; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#14171C; --muted:#5B6270; --faint:#8A919E; --line:#D8DCE3;
  --band:#1D2735; --band-ink:#F4F6F9;
  --shinjuku:#E4262D; --kyoto:#168A45; --ginza:#E88A00; --travel:#3B5BDB;
  --accent:var(--shinjuku);
  --ok:#1C7C4A; --ok-bg:#E3F4EA; --warn:#9A5B00; --warn-bg:#FFF1D6; --bad:#B42318; --bad-bg:#FDE7E5;
  --shadow:0 1px 2px rgba(20,23,28,.06),0 4px 16px rgba(20,23,28,.06);
  --r:14px;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1014; --surface:#171A20; --surface-2:#1E222A; --ink:#ECEFF3; --muted:#A3AAB6; --faint:#7C8490; --line:#2B3039;
    --band:#243246; --band-ink:#F4F6F9;
    --shinjuku:#FF5A5F; --kyoto:#3CC274; --ginza:#FFA62B; --travel:#7C95FF;
    --ok:#6FD39A; --ok-bg:#15301F; --warn:#FFC266; --warn-bg:#33260D; --bad:#FF8A80; --bad-bg:#3A1714;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1014; --surface:#171A20; --surface-2:#1E222A; --ink:#ECEFF3; --muted:#A3AAB6; --faint:#7C8490; --line:#2B3039;
  --band:#243246; --band-ink:#F4F6F9;
  --shinjuku:#FF5A5F; --kyoto:#3CC274; --ginza:#FFA62B; --travel:#7C95FF;
  --ok:#6FD39A; --ok-bg:#15301F; --warn:#FFC266; --warn-bg:#33260D; --bad:#FF8A80; --bad-bg:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:88px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 6px}
.brand{font-weight:900;letter-spacing:.02em;font-size:16px}
.brand small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px;font-family:var(--mono)}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:4px 10px;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px 5px;min-width:54px;text-align:center;cursor:pointer;position:relative}
.chip b{display:block;font-family:var(--mono);font-size:15px;line-height:1.1;font-variant-numeric:tabular-nums}
.chip span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chip i{position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:2px;background:var(--c,var(--line))}
.chip[aria-current="true"]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.chip[aria-current="true"] span{color:var(--band-ink);opacity:.8}
.chip .today{position:absolute;top:-5px;right:-3px;background:var(--bad);color:#fff;font-size:9px;font-weight:700;border-radius:6px;padding:0 4px;letter-spacing:.04em}

/* station sign */
.sign{margin-top:14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.sign-main{padding:14px 16px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.sign-jp{font-size:40px;font-weight:900;line-height:1.05;letter-spacing:.04em;text-wrap:balance}
.sign-en{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.sign-date{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sign-date b{display:block;font-size:26px;line-height:1}
.sign-date span{font-size:12px;color:var(--muted)}
.sign-band{background:var(--band);color:var(--band-ink);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:12.5px;border-top:4px solid var(--accent)}
.sign-band button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--band-ink);text-align:left;font-weight:500}
.sign-band button:last-child{text-align:right}
.sign-band button:disabled{opacity:.35;cursor:default}
.sign-band .num{font-family:var(--mono);opacity:.75;padding-inline:6px;white-space:nowrap}
.daysum{padding:12px 16px 14px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:13.5px}
.daysum div{display:grid;grid-template-columns:78px 1fr;gap:8px}
.daysum dt,.lbl{color:var(--faint);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.banner{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);font-size:13px;color:var(--muted)}

/* sections */
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h2{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--muted)}
.sec-h small{font-size:12px;color:var(--faint)}

/* booking cards */
.bk{display:grid;gap:8px}
.bk-card{background:var(--surface);border-radius:12px;padding:12px 14px;border:1px solid var(--line);display:grid;gap:4px}
.bk-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bk-card h3{margin:0;font-size:15px;font-weight:700;line-height:1.3}
.bk-card p{margin:0;font-size:13px;color:var(--muted)}
.pill{flex:0 0 auto;display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.soft{border-color:var(--line);color:var(--muted)}
.pill.solid{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* route line */
.route{position:relative;padding-left:30px}
.route::before{content:"";position:absolute;left:10px;top:10px;bottom:18px;width:4px;border-radius:2px;background:var(--accent);opacity:.9}
.stop{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px}
.stop::before{content:"";position:absolute;left:-26px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:4px solid var(--accent)}
.stop.tentative::before{border-style:dotted}
.stop-head{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px 10px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.stop-time{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.stop-title{font-size:16.5px;font-weight:700;line-height:1.3;grid-column:1/-1;text-wrap:balance}
.stop-sub{grid-column:1/-1;font-size:13px;color:var(--muted)}
.stop-body{padding:0 14px 14px;display:grid;gap:10px;font-size:14px}
.stop-body p{margin:0}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:700;text-decoration:none;cursor:pointer;min-height:40px}
.btn.primary{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.addr{display:grid;gap:2px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.addr .jp{font-size:15px;font-weight:500;line-height:1.45}
.addr .en{font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;font-size:13.5px}
.kv dt{color:var(--faint);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding-top:3px}
.kv dd{margin:0}
.seg{position:relative;margin:-2px 0 10px;padding:4px 0 4px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg::before{content:"";position:absolute;left:-23px;top:50%;width:8px;height:8px;border-radius:50%;background:var(--ground);border:2px solid var(--accent);transform:translateY(-50%)}
.mode{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.seg .t{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* meals */
.meal-group{margin-bottom:14px}
.meal-group h3{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.meal-group h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent)}
.meals{display:grid;gap:8px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.meal-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.meal h4{margin:0;font-size:15px;line-height:1.3}
.meal .choice{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.meal .price{font-family:var(--mono);font-weight:600;font-size:14px;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.meta .m{padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.meta .m b{color:var(--ink);font-family:var(--mono)}
.meal p{margin:0;font-size:13px;color:var(--muted)}
details.more summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" ＋"}
details.more[open] summary::after{content:" －"}
details.more > div{display:grid;gap:8px;margin-top:8px}

/* info */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:10px}
.card h3{margin:0;font-size:16px}
.flight{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.flight .ap{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1}
.flight .tm{font-family:var(--mono);font-size:13px;color:var(--muted)}
.flight .mid{font-size:11px;color:var(--faint);text-align:center;letter-spacing:.08em;text-transform:uppercase}
.flight .r{text-align:right}
.hotel{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.hotel:first-of-type{border-top:0;padding-top:0}
.hotel h4{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.hotel h4 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.emerg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.emerg div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.emerg b{display:block;font-family:var(--mono);font-size:22px;line-height:1.1;user-select:all}
.emerg span{font-size:12px;color:var(--muted)}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.conv label{display:grid;gap:4px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.conv input{width:100%;font-family:var(--mono);font-size:22px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);min-width:0}
.conv .eq{padding-bottom:12px;color:var(--faint);font-family:var(--mono)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 9px;font-family:var(--mono);font-size:12.5px;cursor:pointer}
.rate{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rate input{width:90px;font-family:var(--mono);padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.phr{display:grid;gap:0}
.phr button{display:grid;gap:1px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;cursor:pointer}
.phr button:first-child{border-top:0}
.phr .jp{font-size:17px;font-weight:700}
.phr .ro{font-size:12.5px;color:var(--muted)}
.phr .en{font-size:12.5px;color:var(--faint)}
.allergy{border:2px solid var(--bad);background:var(--bad-bg)}
.allergy h3{color:var(--bad)}
.todo li{margin-bottom:6px}
.foot{margin-top:28px;font-size:12px;color:var(--faint);text-align:center;display:grid;gap:4px}

/* overlay card for drivers */
.show{position:fixed;inset:0;z-index:60;background:#FFFFFF;color:#111;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));cursor:pointer}
.show .big{font-size:clamp(26px,7.2vw,44px);font-weight:900;line-height:1.35;letter-spacing:.02em;word-break:break-all}
.show .name{font-size:clamp(20px,5vw,28px);font-weight:700}
.show .en{font-size:16px;color:#555}
.show .hint{font-size:13px;color:#888}
.show .ask{font-size:clamp(18px,5vw,24px);font-weight:700;color:#B42318}

/* ask */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--band);color:var(--band-ink);border:0;border-radius:999px;padding:14px 18px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center;cursor:pointer}
.fab svg{width:18px;height:18px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);max-height:86vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-h b{font-size:15px}
.sheet-h button{background:none;border:0;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;padding:6px}
.chat{overflow-y:auto;padding:12px 16px;display:grid;gap:10px;flex:1 1 auto;min-height:120px}
.msg{padding:10px 12px;border-radius:12px;font-size:14.5px;white-space:pre-wrap;max-width:92%}
.msg.u{background:var(--band);color:var(--band-ink);justify-self:end}
.msg.a{background:var(--surface-2);justify-self:start}
.msg.note{background:none;color:var(--muted);font-size:13px;padding:0}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.ask-form{display:flex;gap:8px;padding:10px 16px 12px;border-top:1px solid var(--line)}
.ask-form textarea{flex:1;resize:none;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px;min-height:44px;max-height:120px}
.ask-form button{border:0;border-radius:12px;background:var(--band);color:var(--band-ink);font-weight:700;padding:0 16px;cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
@media (prefers-reduced-motion:no-preference){
  #day{transition:opacity .15s ease}
  #day.fade{opacity:.35}
}
@media (min-width:700px){.sheet{left:50%;right:auto;width:620px;transform:translateX(-50%)}}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">旅 Japan <small>Nov 14–24</small></div>
      <div class="clock" id="clock" aria-live="off"></div>
    </div>
    <nav class="days" id="days" aria-label="Trip days"></nav>
  </div>
</header>

<main class="wrap" id="day" tabindex="-1"></main>

<button class="fab" id="fab" type="button" aria-haspopup="dialog">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
  Ask
</button>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="ask-title" hidden>
  <div class="sheet-h"><b id="ask-title">Ask about the trip</b><button type="button" id="ask-close">Close</button></div>
  <div class="chat" id="chat">
    <div class="msg note" id="ask-intro">Answers use your itinerary, meal list and bookings, plus what Claude knows about Tokyo and Kyoto. Live hours, queues and train times still need checking.</div>
    <div class="sugg" id="sugg"></div>
  </div>
  <form class="ask-form" id="ask-form">
    <label for="ask-input" class="visually-hidden" hidden>Question</label>
    <textarea id="ask-input" rows="1" placeholder="e.g. What's near us for dessert?"></textarea>
    <button type="submit" id="ask-send">Ask</button>
  </form>
</section>

OOKED — confirmation # not in sheet","priority":"High","usd":"Paid","timing":"Check-in 3:00 PM • Check-out 10:00 AM","dependency":"—","notes":"1 Via Inn Single Room (2 persons), non-smoking. Tel +81-3-3226-5489. Add confirmation # and cancellation policy.","link":"https://www.viainn.com/en/shinjuku/","maps":"https://www.google.com/maps/search/?api=1&query=Via%20Inn%20Shinjuku%20Tokyo","tabelog":""},{"row":15,"date":"2026-11-19","item":"Hotel: eph KYOTO (11/19–11/22)","area":"Kyoto Station (Hachijo side)","status":"BOOKED — confirmation # not in sheet","priority":"High","usd":"Cancel fee US$509 from 11/11","timing":"Check-in 3:00 PM • Check-out 11:00 AM","dependency":"FREE cancellation until 11/10/2026 23:59 JST","notes":"Superior Double Room, 3 nights. Tel +81-75-693-8898. Breakfast optional ($14 pp).","link":"https://www.eph-hotel.com/kyoto/","maps":"https://www.google.com/maps/search/?api=1&query=eph%20KYOTO","tabelog":""},{"row":16,"date":"2026-11-22","item":"Hotel: Hyatt Centric Ginza Tokyo (11/22–11/24)","area":"Ginza","status":"BOOKED","priority":"High","usd":"Paid","timing":"Check-in 3:00 PM • Check-out 12:00 PM (noon)","dependency":"Cancellation policy not in sheet — check Hyatt app","notes":"Standard room, 1 King, 2 guests. Tel +81-3-6837-1234.","link":"https://www.hyatt.com/hyatt-centric/en-US/tyoct-hyatt-centric-ginza-tokyo","maps":"https://www.google.com/maps/search/?api=1&query=Hyatt%20Centric%20Ginza%20Tokyo","tabelog":""},{"row":null,"date":"2026-11-15","item":"Narita Express: Narita T1 → Shinjuku","area":"Narita Airport Terminal 1","status":"Seats reserved","priority":"High","usd":"¥5,200 pp (N’EX Tokyo Round Trip Ticket)","timing":"Narita-Express (SHINJUKU) 50, 19:49 → 21:18","dependency":"Flight SQ11 arrival; immigration and baggage","notes":"Car 8, seats 1A + 1B, 2 adults. Pick up ticket at the JR East counter or Reserved Seat Ticket Vending Machine. Return leg 11/24 Tokyo Station → Narita still to reserve.","link":"https://www.eki-net.com/en/jrea date":"11/21 Sat","base":"Kyoto","main":"Arashiyama photo walk; flexible central shopping/cafés","food":"Arashiyama Yoshimura preferred; % Arabica coffee; Katsugyu gyukatsu dinner","travel":"JR Sagano Line + walking","book":"Lunch reservations only if choosing an alternative","flex":"Gyukatsu goal fulfilled"},{"date":"11/22 Sun","base":"Kyoto → Ginza","main":"Shinkansen; check-in; Itoya + UNIQLO Ginza","food":"Light lunch (ekiben / Ginza Kagari / Ginza Sand); Sushi Itsutsu omakase","travel":"Nozomi + rail/Uber + walking","book":"Shinkansen + Sushi Itsutsu required","flex":"Second Fuji glimpse chance"},{"date":"11/23 Mon","base":"Ginza / Marunouchi","main":"Ginza department stores; Marunouchi, KITTE and Tokyo Station","food":"Lunch: Ginza Bairin / Ginza Happo / Hina Sushi; Vinefru or Shiseido Parlour dessert; Oreshiki Jun ramen or Nemuro Hanamaru sushi","travel":"Walking or Marunouchi Line","book":"No fixed booking","flex":"Relaxed final full day"},{"date":"11/24 Tue","base":"Ginza → NRT","main":"Last-minute Ginza; airport; NOA Priority Pass lounge","food":"Lunch near hotel (Kagari / Bairin / Ginza Sand takeaway); lounge snacks","travel":"Uber + reserved N'EX","book":"Book N'EX; verify terminal and boarding time","flex":"Depart NRT 6:15 PM for LAX"}],"reminders":[{"k":"Peanut allergy","v":"Disclose during every restaurant booking and reconfirm on arrival; ask about sauces, frying oil, desserts and shared surfaces."},{"k":"Timed tickets","v":"Shibuya Sky and teamLab Planets are the two high-priority attraction bookings."},{"k":"Rail","v":"Book both Shinkansen legs and the 11/24 Narita Express; request adjacent seats and check large-baggage rules."},{"k":"Sushi Itsutsu","v":"Target the 8:00 PM seating on 11/22 and obtain allergy confirmation before paying."},{"k":"Manga portrait","v":"Check the November artist schedule; the portrait slot is handled in person at opening."},{"k":"Live conditions","v":"Recheck November opening hours, train schedules, queues and weather shortly before departure."}]}</script>
<script>
(function(){
const T = JSON.parse(document.getElementById('trip-data').textContent);
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1AQA7ZFSglBogUfBLcx9ptGZbLecowNiwKlKn8waO70A/edit';
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

const CITY = {
  shinjuku:{jp:'新宿', en:'Shinjuku', c:'var(--shinjuku)'},
  kyoto:{jp:'京都', en:'Kyoto', c:'var(--kyoto)'},
  ginza:{jp:'銀座', en:'Ginza', c:'var(--ginza)'},
  air:{jp:'機内', en:'In the air', c:'var(--travel)'}
};
const cityOfTab = t => /Kyoto/i.test(t) ? 'kyoto' : /Ginza/i.test(t) ? 'ginza' : 'shinjuku';
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dparts = iso => { const [y,m,d] = iso.split('-').map(Number); const dt = new Date(Date.UTC(y,m-1,d)); return {y,m,d,wd:WD[dt.getUTCDay()]}; };

// ---- build days from sheet data ----
const dates = new Set();
T.itinerary.forEach(i => dates.add(i.date));
T.reservations.forEach(r => { if (/^\d{4}-/.test(r.date)) dates.add(r.date); });
const DAYS = [...dates].filter(d => d >= '2026-11-14' && d <= '2026-11-24').sort().map(date => {
  const items = T.itinerary.filter(i => i.date === date);
  const cities = [];
  items.forEach(i => { const c = cityOfTab(i.tab); if (!cities.includes(c)) cities.push(c); });
  if (!cities.length) cities.push('air');
  const p = dparts(date);
  const sum = T.summary.find(s => { const m = s.date.match(/^(\d+)\/(\d+)/); return m && +m[1] === p.m && +m[2] === p.d; });
  return { date, items, cities, p, sum,
    meals: T.meals.filter(m => m.date === date),
    res: T.reservations.filter(r => r.date === date || hotelCovers(r, date)) };
});
function hotelCovers(r, date){
  const m = r.item.match(/\((\d+)\/(\d+)[–-](\d+)\/(\d+)\)/);
  if (!/^Hotel/i.test(r.item) || !m) return false;
  const a = `2026-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`, b = `2026-${m[3].padStart(2,'0')}-${m[4].padStart(2,'0')}`;
  return date > a && date <= b;
}

// ---- Japan time ----
function jstNow(){ const n = new Date(); return new Date(n.getTime() + n.getTimezoneOffset()*60000 + 9*3600000); }
function jstISO(){ const j = jstNow(); return `${j.getFullYear()}-${String(j.getMonth()+1).padStart(2,'0')}-${String(j.getDate()).padStart(2,'0')}`; }
function tickClock(){
  const j = jstNow();
  $('#clock').innerHTML = `Japan ${String(j.getHours()).padStart(2,'0')}:${String(j.getMinutes()).padStart(2,'0')}<br>${WD[j.getDay()]} ${MO[j.getMonth()]} ${j.getDate()}`;
}

// ---- icons ----
const ICON = {
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/><circle cx="7.5" cy="16" r="1"/><circle cx="16.5" cy="16" r="1"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>'
};

// ---- helpers ----
function statusPill(s){
  if (!s) return '';
  const t = s.toLowerCase();
  let cls = 'soft';
  if (/booked|confirmed|fixed|ticketed/.test(t)) cls = 'ok';
  else if (/not booked|book|required|undecided|check/.test(t)) cls = 'warn';
  else if (/approved|selected|planned|preferred/.test(t)) cls = 'solid';
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}
function resPill(r){
  if (!r || r === '—') return '';
  const t = r.toLowerCase();
  if (/^no\b/.test(t) && !/queue|wait|ticket/.test(t)) return `<span class="pill soft">No reservation</span>`;
  if (/required/.test(t)) return `<span class="pill warn">Reservation required</span>`;
  if (/recommended/.test(t)) return `<span class="pill warn">Reserve: recommended</span>`;
  if (/ticketed/.test(t)) return `<span class="pill ok">Ticketed</span>`;
  return `<span class="pill soft">${esc(r)}</span>`;
}
function modes(text){
  const t = text || '', out = [];
  if (/shinkansen|nozomi/i.test(t)) out.push('Shinkansen');
  if (/N[’']EX|Narita Express/i.test(t)) out.push("N'EX");
  if (/Marunouchi Line|Ginza Line|Yurakucho|Karasuma|subway|Metro/i.test(t)) out.push('Subway');
  if (/\bJR\b|Yamanote|Nara Line|Sagano/i.test(t)) out.push('JR');
  if (/Yurikamome/i.test(t)) out.push('Yurikamome');
  if (/uber|taxi/i.test(t)) out.push('Uber/taxi');
  if (/walk/i.test(t)) out.push('Walk');
  return [...new Set(out)];
}
const isUrl = u => /^https?:\/\//.test(u || '');
function links(maps, official, tabelog){
  const b = [];
  if (isUrl(maps)) b.push(`<a class="btn" href="${esc(maps)}" target="_blank" rel="noopener">${ICON.map}Google Maps</a>`);
  String(official || '').split('|').map(s => s.trim()).filter(isUrl).forEach((u, i) => b.push(`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${ICON.link}${/tabelog/.test(u) ? 'Tabelog' : i ? 'Site 2' : 'Official / book'}</a>`));
  if (isUrl(tabelog) && tabelog !== official) b.push(`<a class="btn" href="${esc(tabelog)}" target="_blank" rel="noopener">${ICON.link}Tabelog</a>`);
  return b.join('');
}
let cardSeq = 0; const CARDS = {};
function addrBlock(jp, en, name){
  if (!jp || /食事オプション参照/.test(jp)) return en && !/See Meal/.test(en) ? `<div class="addr"><span class="en">${esc(en)}</span></div>` : '';
  const id = 'c' + (++cardSeq); CARDS[id] = {jp, en, name};
  return `<div class="addr"><span class="lbl">Address · 住所</span><span class="jp">${esc(jp)}</span>${en && !/See Meal/.test(en) ? `<span class="en">${esc(en)}</span>` : ''}</div>
    <div class="row-actions"><button class="btn primary" type="button" data-card="${id}">${ICON.car}Show driver</button></div>`;
}

// ---- rendering ----
let cur = 0;
function renderChips(){
  const today = jstISO();
  $('#days').innerHTML = DAYS.map((d, i) => {
    const c = CITY[d.cities[d.cities.length - 1]].c;
    return `<button class="chip" type="button" data-i="${i}" aria-current="${i === cur}" style="--c:${c}"><span>${d.p.wd}</span><b>${d.p.d}</b>${d.date === today ? '<em class="today">TODAY</em>' : ''}<i></i></button>`;
  }).join('') + `<button class="chip" type="button" data-i="info" aria-current="${cur === 'info'}" style="--c:var(--band)"><span>Info</span><b>i</b><i></i></button>`;
  const a = $('#days [aria-current="true"]'); if (a) a.scrollIntoView({block:'nearest', inline:'center'});
}

function renderDay(i){
  cardSeq = 0; for (const k in CARDS) delete CARDS[k];
  const d = DAYS[i];
  const last = d.cities[d.cities.length - 1];
  document.documentElement.style.setProperty('--accent', CITY[last].c);
  const jp = d.cities.map(c => CITY[c].jp).join(' → ');
  const en = d.cities.map(c => CITY[c].en).join(' → ');
  const prev = DAYS[i-1], next = DAYS[i+1];
  const today = jstISO();
  let banner = '';
  if (today < DAYS[0].date) {
    const days = Math.round((Date.parse(DAYS[0].date) - Date.parse(today)) / 86400000);
    banner = `<div class="banner">Trip starts in <b>${days} day${days === 1 ? '' : 's'}</b>. During the trip this page opens to today automatically, on Japan time.</div>`;
  }
  const s = d.sum;
  const sumHtml = s ? `<dl class="daysum">
      <div><dt>Plan</dt><dd>${esc(s.main)}</dd></div>
      <div><dt>Food</dt><dd>${esc(s.food)}</dd></div>
      <div><dt>Getting around</dt><dd>${esc(s.travel)}</dd></div>
      ${s.book && s.book !== 'None' ? `<div><dt>Book / check</dt><dd>${esc(s.book)}</dd></div>` : ''}
      ${s.flex ? `<div><dt>Note</dt><dd>${esc(s.flex)}</dd></div>` : ''}
    </dl>` : '';

  // bookings for this day
  const res = d.res.filter(r => !(/^Hotel/i.test(r.item) && r.date !== d.date && !isCheckout(r, d.date)));
  const bkHtml = res.length ? `<section class="sec"><div class="sec-h"><h2>Bookings today</h2><small>from the Reservations tab</small></div><div class="bk">${res.map(r => `
      <div class="bk-card">
        <div class="bk-top"><h3>${esc(r.item)}</h3>${statusPill(r.status)}</div>
        ${r.timing ? `<p><b>${esc(r.timing)}</b></p>` : ''}
        ${r.usd ? `<p>${esc(r.usd)}</p>` : ''}
        ${r.dependency && r.dependency !== '—' ? `<p>${/cancel/i.test(r.dependency) ? '<b>Cancellation:</b> ' : '<b>Depends on:</b> '}${esc(r.dependency)}</p>` : ''}
        ${r.notes ? `<p>${esc(r.notes)}</p>` : ''}
        <div class="row-actions">${links(r.maps, r.link, r.tabelog)}</div>
      </div>`).join('')}</div></section>` : '';

  // route
  let prevTo = null;
  const stops = d.items.map((it, k) => {
    const tentative = /tentative|optional|flexible|open/i.test(it.status);
    const m = modes((it.directions || '') + ' ' + (it.travel || ''));
    const seg = (k > 0 || it.from) && it.travel && it.travel !== '—' ? `<div class="seg">${m.map(x => `<span class="mode">${esc(x)}</span>`).join('')}<span class="t">${esc(it.travel)}</span>${it.from ? `<span>from ${esc(it.from)}</span>` : ''}</div>` : '';
    prevTo = it.to;
    const open = k === 0 ? '' : '';
    return `${seg}<article class="stop${tentative ? ' tentative' : ''}">
      <button class="stop-head" type="button" aria-expanded="false" data-stop>
        <span class="stop-time">${esc(it.time)}</span>${statusPill(it.status)}
        <span class="stop-title">${esc(it.plan)}</span>
        <span class="stop-sub">${esc(it.to)}${it.cost && it.cost !== '—' ? ' · ' + esc(it.cost) : ''}</span>
      </button>
      <div class="stop-body" hidden>
        ${addrBlock(it.addrJp, it.addrEn, it.to)}
        <dl class="kv">
          ${it.directions ? `<dt>How</dt><dd>${esc(it.directions)}</dd>` : ''}
          ${it.travel ? `<dt>Travel</dt><dd>${esc(it.travel)}</dd>` : ''}
          ${it.cost ? `<dt>Cost</dt><dd>${esc(it.cost)}</dd>` : ''}
          ${it.reservation ? `<dt>Booking</dt><dd>${resPill(it.reservation) || esc(it.reservation)} ${bookingLine(it, d)}</dd>` : ''}
          ${it.notes ? `<dt>Notes</dt><dd>${esc(it.notes)}</dd>` : ''}
        </dl>
        <div class="row-actions">${links(it.maps, it.official, it.tabelog)}</div>
      </div>
    </article>`;
  }).join('');
  const routeHtml = d.items.length ? `<section class="sec"><div class="sec-h"><h2>The plan</h2><small>tap a stop for details</small></div><div class="route">${stops}</div></section>` : '';

  // meals
  const order = ['Breakfast','Lunch','Café','Drinks','Snack / dessert','Dessert','Dinner'];
  const groups = {};
  d.meals.forEach(m => { (groups[m.meal] = groups[m.meal] || []).push(m); });
  const gk = Object.keys(groups).sort((a, b) => (order.indexOf(a) + 99) % 99 - (order.indexOf(b) + 99) % 99);
  const mealsHtml = gk.length ? `<section class="sec"><div class="sec-h"><h2>Eat</h2><small>USD per person · Google / Tabelog</small></div>${gk.map(g => `
    <div class="meal-group"><h3>${esc(g)}</h3><div class="meals">${groups[g].map(mealCard).join('')}</div></div>`).join('')}</section>` : '';

  $('#day').innerHTML = `
    ${banner}
    <section class="sign" aria-label="Day overview">
      <div class="sign-main">
        <div class="sign-jp">${esc(jp)}</div>
        <div class="sign-date"><b>${d.p.d}</b><span>${d.p.wd} · ${MO[d.p.m - 1]}</span></div>
        <div class="sign-en">${esc(en)}</div>
      </div>
      <div class="sign-band">
        <button type="button" data-go="${i-1}" ${prev ? '' : 'disabled'}>← ${prev ? prev.p.wd + ' ' + prev.p.d : ''}</button>
        <span class="num">Day ${i + 1} of ${DAYS.length}</span>
        <button type="button" data-go="${i+1}" ${next ? '' : 'disabled'}>${next ? next.p.wd + ' ' + next.p.d : ''} →</button>
      </div>
      ${sumHtml}
    </section>
    ${bkHtml}
    ${routeHtml}
    ${mealsHtml}
    ${footer()}`;
}
function isCheckout(r, date){ const m = r.item.match(/[–-](\d+)\/(\d+)\)/); return m && date === `2026-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; }
function bookingLine(it, d){
  const words = it.plan.toLowerCase().split(/[^a-z]+/).filter(w => w.length > 4);
  const r = T.reservations.find(r => r.date === d.date && words.some(w => r.item.toLowerCase().includes(w)));
  return r ? `<br><span style="color:var(--muted)">${esc(r.status)}${r.timing ? ' — ' + esc(r.timing) : ''}</span>` : '';
}
function mealCard(m){
  const g = m.google && m.google !== 'n/a' ? `<span class="m">Google <b>${esc(m.google)}</b></span>` : '';
  const tb = /^\d/.test(m.tabelogScore) ? `<span class="m">Tabelog <b>${esc(m.tabelogScore)}</b></span>` : (m.tabelogScore && m.tabelogScore !== 'n/a' ? `<span class="m">Tabelog <b>—</b></span>` : '');
  return `<article class="meal">
    <div class="meal-top"><div><div class="choice">${esc(m.choice)}</div><h4>${esc(m.name)}</h4></div><span class="price">${esc(m.usd)}</span></div>
    <div class="meta"><span class="m">${esc(m.food)}</span>${g}${tb}${resPill(m.reservation) || (m.reservation ? `<span class="pill soft">${esc(m.reservation)}</span>` : '')}</div>
    <p>${esc(m.route)}</p>
    <details class="more"><summary>Details, address, links</summary><div>
      ${m.why ? `<p>${esc(m.why)}</p>` : ''}
      ${m.note ? `<p>${esc(m.note)}</p>` : ''}
      ${addrBlock(m.addrJp, m.area, m.name)}
      <div class="row-actions">${links(m.maps, m.official, m.tabelog)}</div>
    </div></details>
  </article>`;
}
function footer(){
  return `<div class="foot"><span>Built from your Google Sheet · synced ${esc(T.generated)}</span><a href="${SHEET_URL}" target="_blank" rel="noopener">Open the sheet</a></div>`;
}

// ---- info ----
const PHRASES = [
  ['この住所までお願いします。','Kono jūsho made onegaishimasu.','Please take us to this address.'],
  ['ピーナッツアレルギーがあります。','Pīnattsu arerugī ga arimasu.','I have a peanut allergy.'],
  ['ピーナッツやピーナッツ油は入っていますか？','Pīnattsu ya pīnattsu-yu wa haitte imasu ka?','Does this contain peanuts or peanut oil?'],
  ['二人です。','Futari desu.','Two people, please.'],
  ['予約しています。','Yoyaku shite imasu.','We have a reservation.'],
  ['お会計お願いします。','Okaikei onegaishimasu.','The check, please.'],
  ['カードは使えますか？','Kādo wa tsukaemasu ka?','Can I pay by card?'],
  ['写真を撮ってもいいですか？','Shashin o totte mo ii desu ka?','May I take a photo?'],
  ['トイレはどこですか？','Toire wa doko desu ka?','Where is the restroom?'],
  ['すみません。','Sumimasen.','Excuse me / sorry.'],
  ['ありがとうございます。','Arigatō gozaimasu.','Thank you.']
];
const ALLERGY_JP = '重度のピーナッツアレルギーがあります。ピーナッツ、ピーナッツ油、ピーナッツを含むソース・調味料・デザートは食べられません。同じ油や調理器具の使用（コンタミ）も危険です。この料理は大丈夫ですか？';
function renderInfo(){
  cardSeq = 0; for (const k in CARDS) delete CARDS[k];
  document.documentElement.style.setProperty('--accent', 'var(--band)');
  const fl = T.reservations.find(r => /^Flight/i.test(r.item));
  const hotels = T.reservations.filter(r => /^Hotel/i.test(r.item));
  const hc = h => /Kyoto/i.test(h.item) ? CITY.kyoto.c : /Ginza/i.test(h.item) ? CITY.ginza.c : CITY.shinjuku.c;
  const itemAddr = name => T.itinerary.find(i => i.addrJp && i.addrJp.includes(name));
  const hotelKeys = [['Via Inn','ヴィアイン新宿'],['eph','eph KYOTO'],['Hyatt','ハイアット']];
  const todo = T.reservations.filter(r => !/booked/i.test(r.status));
  const rate = +(store.get('rate') || T.yenPerUsd) || 158.7;
  $('#day').innerHTML = `
    <section class="sign"><div class="sign-main"><div class="sign-jp">案内</div><div class="sign-date"><b>i</b><span>Quick reference</span></div><div class="sign-en">Info</div></div>
    <div class="sign-band" style="border-top-color:var(--travel)"><button type="button" data-go="${DAYS.length-1}">← ${DAYS[DAYS.length-1].p.wd} ${DAYS[DAYS.length-1].p.d}</button><span class="num">Flights · hotels · help</span><button type="button" disabled></button></div></section>

    <section class="sec"><div class="card allergy"><h3>Peanut allergy card</h3><p style="margin:0;font-size:17px;font-weight:700;line-height:1.5">${ALLERGY_JP}</p><p style="margin:0;font-size:13px">Severe peanut allergy: no peanuts, peanut oil, or sauces/desserts containing peanut. Shared oil or utensils are also dangerous. Is this dish OK?</p><div class="row-actions"><button class="btn primary" type="button" data-allergy>Show full screen</button></div></div></section>

    <section class="sec"><div class="sec-h"><h2>Flights</h2><small>Singapore Airlines</small></div>
      <div class="card">
        <div class="flight"><div><div class="ap">LAX</div><div class="tm">Sat 11/14 · 12:25 PM</div></div><div class="mid">11h 55m<br>nonstop</div><div class="r"><div class="ap">NRT</div><div class="tm">Sun 11/15 · 5:20 PM</div></div></div>
        <div class="flight" style="border-top:1px solid var(--line);padding-top:10px"><div><div class="ap">NRT</div><div class="tm">Tue 11/24 · 6:15 PM</div></div><div class="mid">9h 40m<br>nonstop</div><div class="r"><div class="ap">LAX</div><div class="tm">Tue 11/24 · 10:55 AM</div></div></div>
        <p style="margin:0;font-size:13px;color:var(--muted)">Booking reference in the Singapore Airlines app · Narita Terminal 1 South Wing · ${fl ? esc(fl.notes) : ''}</p>
      </div></section>

    <section class="sec"><div class="sec-h"><h2>Hotels</h2><small>tap “Show driver” for taxis</small></div>
      <div class="card">${hotels.map(h => {
        const key = hotelKeys.find(k => h.item.includes(k[0]));
        const it = key ? itemAddr(key[1]) : null;
        return `<div class="hotel"><h4><i style="--c:${hc(h)}"></i>${esc(h.item.replace(/^Hotel:\s*/, ''))}</h4>
          <div>${statusPill(h.status)}</div>
          <p style="margin:0;font-size:14px"><b>${esc(h.timing)}</b></p>
          ${h.dependency && h.dependency !== '—' ? `<p style="margin:0;font-size:13px"><b>Cancellation:</b> ${esc(h.dependency)}</p>` : ''}
          <p style="margin:0;font-size:13px;color:var(--muted)">${esc(h.usd)} · ${esc(h.notes)}</p>
          ${it ? addrBlock(it.addrJp, it.addrEn, h.item) : ''}
          <div class="row-actions">${links(h.maps, h.link, '')}</div></div>`;
      }).join('')}</div></section>

    <section class="sec"><div class="sec-h"><h2>Yen ⇄ dollars</h2><small>rate from the Data tab</small></div>
      <div class="card">
        <div class="conv">
          <label for="yen">Yen ¥<input id="yen" inputmode="decimal" autocomplete="off" value="1000"></label>
          <span class="eq">=</span>
          <label for="usd">US $<input id="usd" inputmode="decimal" autocomplete="off"></label>
        </div>
        <div class="quick">${[500,1000,3000,5000,10000,20000].map(v => `<button type="button" data-yen="${v}">¥${v.toLocaleString()}</button>`).join('')}</div>
        <div class="rate"><label for="rate">¥ per $1</label><input id="rate" inputmode="decimal" value="${rate}"><span>Sheet value: ${esc(T.yenPerUsd)}</span></div>
      </div></section>

    <section class="sec"><div class="sec-h"><h2>Emergency</h2><small>dial from any phone</small></div>
      <div class="emerg">
        <div><b>110</b><span>Police</span></div>
        <div><b>119</b><span>Ambulance &amp; fire (say “kyūkyū” for ambulance)</span></div>
        <div><b>050-3816-2787</b><span>Japan Visitor Hotline (JNTO), 24 h, English</span></div>
        <div><b>03-3224-5000</b><span>U.S. Embassy Tokyo</span></div>
        <div><b>06-6315-5900</b><span>U.S. Consulate Osaka-Kobe (nearest to Kyoto)</span></div>
        <div><b>#7119</b><span>Tokyo medical advice line (Japanese; is it an emergency?)</span></div>
      </div></section>

    <section class="sec"><div class="sec-h"><h2>Useful phrases</h2><small>tap to show large</small></div>
      <div class="card phr">${PHRASES.map((p, k) => `<button type="button" data-phrase="${k}"><span class="jp">${p[0]}</span><span class="ro">${p[1]}</span><span class="en">${p[2]}</span></button>`).join('')}</div></section>

    <section class="sec"><div class="sec-h"><h2>Still to book</h2><small>${todo.length} items · from Reservations</small></div>
      <div class="card"><ul class="todo" style="margin:0;padding-left:18px">${todo.map(r => `<li><b>${esc(r.item)}</b> (${esc(dateLabel(r.date))}) — ${esc(r.status)}. <span style="color:var(--muted)">${esc(r.timing)}</span></li>`).join('')}</ul></div></section>

    ${T.reminders.length ? `<section class="sec"><div class="sec-h"><h2>Reminders</h2><small>from the Summary tab</small></div><div class="card"><dl class="kv">${T.reminders.map(r => `<dt>${esc(r.k)}</dt><dd>${esc(r.v)}</dd>`).join('')}</dl></div></section>` : ''}
    ${footer()}`;
  const yen = $('#yen'), usd = $('#usd'), rt = $('#rate');
  const R = () => { const v = parseFloat(rt.value); return v > 0 ? v : 158.7; };
  const fromYen = () => { const v = parseFloat(yen.value.replace(/,/g, '')); usd.value = isFinite(v) ? (v / R()).toFixed(2) : ''; };
  const fromUsd = () => { const v = parseFloat(usd.value.replace(/,/g, '')); yen.value = isFinite(v) ? Math.round(v * R()) : ''; };
  yen.addEventListener('input', fromYen); usd.addEventListener('input', fromUsd);
  rt.addEventListener('input', () => { store.set('rate', rt.value); fromYen(); });
  $('#day').querySelectorAll('[data-yen]').forEach(b => b.addEventListener('click', () => { yen.value = b.dataset.yen; fromYen(); }));
  fromYen();
}
function dateLabel(iso){ if (!/^\d{4}-/.test(iso)) return iso; const p = dparts(iso); return `${p.wd} ${p.m}/${p.d}`; }

// ---- navigation ----
function go(i, focus){
  if (i !== 'info') { i = Math.max(0, Math.min(DAYS.length - 1, +i)); }
  cur = i;
  const el = $('#day'); el.classList.add('fade');
  if (i === 'info') renderInfo(); else renderDay(i);
  renderChips();
  requestAnimationFrame(() => el.classList.remove('fade'));
  try { history.replaceState(null, '', '#' + (i === 'info' ? 'info' : 'd' + DAYS[i].date)); } catch(e){}
  window.scrollTo({top:0});
  if (focus) el.focus({preventScroll:true});
}
function initialIndex(){
  const h = (location.hash || '').slice(1);
  if (h === 'info') return 'info';
  const m = h.match(/^d(\d{4}-\d{2}-\d{2})$/);
  if (m) { const k = DAYS.findIndex(d => d.date === m[1]); if (k >= 0) return k; }
  const t = jstISO();
  const k = DAYS.findIndex(d => d.date === t);
  if (k >= 0) return k;
  if (t > DAYS[DAYS.length-1].date) return DAYS.length - 1;
  return DAYS.findIndex(d => d.items.length) >= 0 ? DAYS.findIndex(d => d.items.length) : 0;
}

document.addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (chip) { go(chip.dataset.i === 'info' ? 'info' : +chip.dataset.i); return; }
  const g = e.target.closest('[data-go]'); if (g && !g.disabled) { go(+g.dataset.go); return; }
  const st = e.target.closest('[data-stop]');
  if (st) { const body = st.nextElementSibling; const open = body.hidden; body.hidden = !open; st.setAttribute('aria-expanded', String(open)); return; }
  const c = e.target.closest('[data-card]'); if (c) { const k = CARDS[c.dataset.card]; showCard(`<div class="ask">この住所までお願いします。</div><div class="big">${esc(k.jp)}</div>${k.en ? `<div class="en">${esc(k.en)}</div>` : ''}`); return; }
  const a = e.target.closest('[data-allergy]'); if (a) { showCard(`<div class="big" style="font-size:clamp(22px,6vw,36px)">${ALLERGY_JP}</div><div class="en">Severe peanut allergy — no peanuts, peanut oil, or shared oil/utensils.</div>`); return; }
  const p = e.target.closest('[data-phrase]'); if (p) { const x = PHRASES[+p.dataset.phrase]; showCard(`<div class="big">${x[0]}</div><div class="name">${esc(x[1])}</div><div class="en">${esc(x[2])}</div>`); return; }
});
function showCard(html){ const s = $('#show'); s.innerHTML = html + '<div class="hint">Tap anywhere to close</div>'; s.hidden = false; }
$('#show').addEventListener('click', () => { $('#show').hidden = true; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#show').hidden = true; closeAsk(); }
  if (e.target.closest('input,textarea')) return;
  if (!$('#sheet').hidden) return;
  if (e.key === 'ArrowRight' && cur !== 'info') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur === 'info' ? DAYS.length - 1 : cur - 1);
});
// swipe between days
let sx = 0, sy = 0, st0 = 0;
$('#day').addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st0 = Date.now(); }, {passive:true});
$('#day').addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50 && Date.now() - st0 < 700) {
    if (dx < 0) { if (cur === 'info') return; go(cur === DAYS.length - 1 ? 'info' : cur + 1); }
    else { go(cur === 'info' ? DAYS.length - 1 : Math.max(0, cur - 1)); }
  }
}, {passive:true});

// ---- Ask ----
const SUGG = ["What's near us for dessert?", 'How long from teamLab to Ginza?', 'What do we still need to book?', 'Where do we eat tonight?'];
$('#sugg').innerHTML = SUGG.map(s => `<button type="button">${esc(s)}</button>`).join('');
$('#sugg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { $('#ask-input').value = b.textContent; ask(); } });
function openAsk(){ $('#sheet').hidden = false; $('#scrim').hidden = false; const d = store.get('askDraft'); if (d && !$('#ask-input').value) $('#ask-input').value = d; $('#ask-input').focus(); }
function closeAsk(){ $('#sheet').hidden = true; $('#scrim').hidden = true; }
$('#fab').addEventListener('click', openAsk);
$('#ask-close').addEventListener('click', closeAsk);
$('#scrim').addEventListener('click', closeAsk);
$('#ask-input').addEventListener('input', e => store.set('askDraft', e.target.value));
$('#ask-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } });
$('#ask-form').addEventListener('submit', e => { e.preventDefault(); ask(); });

function tripContext(){
  const L = [];
  L.push('TRAVELERS: a couple. One has a SEVERE PEANUT ALLERGY. Preferences: ~2 main activities/day close together; walking, subway/train or Uber only (NO buses); few shrines/temples; like efficient routes, photo spots, shopping, cafés, city atmosphere; food: sushi, ramen, gyukatsu, yakiniku, desserts, a few higher-end meals.');
  L.push(`FLIGHTS: Singapore Airlines. LAX Sat 11/14 12:25 PM -> NRT Sun 11/15 5:20 PM. Return NRT T1 Tue 11/24 6:15 PM -> LAX 10:55 AM.`);
  T.reservations.forEach(r => L.push(`BOOKING ${r.date}: ${r.item} | ${r.status} | ${r.timing} | ${r.dependency} | ${r.notes}`));
  DAYS.forEach(d => {
    L.push(`\n== ${d.p.wd} ${d.date} (${d.cities.map(c => CITY[c].en).join(' -> ')}) ==`);
    d.items.forEach(i => L.push(`- ${i.time} | ${i.plan} [${i.status}] | to: ${i.to} | ${i.travel} | how: ${i.directions} | cost: ${i.cost} | reservation: ${i.reservation} | notes: ${i.notes} | addr: ${i.addrEn}`));
    d.meals.forEach(m => L.push(`  MEAL ${m.meal} (${m.choice}): ${m.name} | ${m.food} | ${m.usd} | Google ${m.google} | Tabelog ${m.tabelogScore} | ${m.area} | ${m.route} | reserve: ${m.reservation}`));
  });
  let s = L.join('\n');
  while (new TextEncoder().encode(s).length > 52000) s = s.replace(/ \| notes: [^|\n]*/, '');
  return s;
}
let turns = [], busy = null;
function addMsg(cls, text){ const el = document.createElement('div'); el.className = 'msg ' + cls; el.textContent = text; $('#chat').appendChild(el); el.scrollIntoView({block:'end'}); return el; }
async function ask(){
  const q = $('#ask-input').value.trim();
  if (!q) return;
  if (busy) { busy.abort(); busy = null; }
  $('#ask-input').value = ''; store.set('askDraft', '');
  $('#sugg').hidden = true;
  addMsg('u', q);
  const out = addMsg('a', 'Thinking…');
  const sample = window.claude ? await window.claude.use('sample') : null;
  if (!sample) { out.textContent = 'Ask isn’t available in this view. Open the page in the Claude app or claude.ai while signed in.'; return; }
  const j = jstNow();
  const where = cur === 'info' ? 'the Info tab' : `${DAYS[cur].p.wd} ${DAYS[cur].date}`;
  const rules = `You are a concise travel companion for a couple on a Japan trip. Answer from their itinerary below first; add practical local knowledge (walking times, what's nearby, which station exit) when helpful, and say plainly when something is general knowledge that they should verify (hours, queues, prices). Respect their preferences and the peanut allergy. Keep answers short and phone-friendly: a direct answer first, then at most 3-5 bullet points. Plain text, no markdown headings.\n\nCurrent Japan time: ${WD[j.getDay()]} ${j.getFullYear()}-${String(j.getMonth()+1).padStart(2,'0')}-${String(j.getDate()).padStart(2,'0')} ${String(j.getHours()).padStart(2,'0')}:${String(j.getMinutes()).padStart(2,'0')}. They are currently viewing ${where}. If the trip hasn't started, assume questions are about that viewed day unless stated.\n\nITINERARY (from their Google Sheet):\n${tripContext()}`;
  turns.push({role:'user', content:q});
  const msgs = [{role:'user', content:rules}, ...turns.slice(-8)];
  const ctl = new AbortController(); busy = ctl;
  $('#ask-send').textContent = 'Stop';
  try {
    const { text, truncated } = await sample(msgs, { cache:false, signal:ctl.signal, onText:({text}) => { out.textContent = text; out.scrollIntoView({block:'end'}); } });
    out.textContent = text + (truncated ? '\n\n(Cut short — ask a narrower question.)' : '');
    turns.push({role:'assistant', content:text});
  } catch (e) {
    turns.pop();
    const code = e && e.code;
    if (code === 'cancelled') out.textContent = e.text || 'Stopped.';
    else if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared') out.textContent = 'Ask needs permission to use Claude. Allow it when prompted, or reload the page to be asked again.';
    else if (code === 'rate_limited') out.textContent = (e.text ? e.text + '\n\n' : '') + 'Too many questions at once or usage limit reached. Try again in a bit.';
    else if (code === 'session_expired') out.textContent = 'Sign in to Claude again, then ask.';
    else if (code === 'refused') out.textContent = 'Claude couldn’t answer that one. Try rephrasing.';
    else out.textContent = (e && e.text ? e.text + '\n\n' : '') + 'Connection problem. Tap a question to try again.';
  } finally {
    if (busy === ctl) busy = null;
    $('#ask-send').textContent = 'Ask';
  }
}
$('#ask-send').addEventListener('click', e => { if (busy) { e.preventDefault(); busy.abort(); } });

// ---- boot ----
tickClock(); setInterval(tickClock, 30000);
go(initialIndex());
})();
</script>
